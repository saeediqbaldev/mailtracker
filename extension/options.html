<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Xeven MTracker — Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #F6F3EC;
      color: #1F2430;
      padding: 32px;
      max-width: 420px;
    }
    h1 { font-size: 18px; margin-bottom: 4px; }
    p.sub { color: #5B5A52; font-size: 13px; margin-top: 0; }
    label { display: block; margin-top: 16px; font-size: 12px; color: #5B5A52; }
    input {
      display: block;
      width: 100%;
      margin-top: 6px;
      padding: 8px 10px;
      border: 1px solid #D9D2C2;
      border-radius: 3px;
      box-sizing: border-box;
    }
    button {
      margin-top: 20px;
      padding: 9px 16px;
      background: #1F2430;
      color: #F6F3EC;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    #status { margin-top: 12px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Xeven MTracker</h1>
  <p class="sub">Works with both Zoho Mail and Gmail. Pre-configured for your backend — you shouldn't need to change these.</p>

  <label>
    Backend URL
    <input type="text" id="backend-url" placeholder="https://track.yourdomain.com" />
  </label>

  <label>
    API key
    <input type="text" id="api-key" placeholder="the API_KEY value from your .env" />
  </label>

  <button id="save-btn">Save</button>
  <p id="status"></p>

  <script src="options.js"></script>
</body>
</html>
